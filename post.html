<head>

  <title>Post — Gihyun Kim</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="style.css?v=52" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="tb-inner">
      <a class="brand" href="index.html">Gihyun Kim <span class="brand-sub">Drawing set &middot; rev. 2026</span></a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html"><i>01</i>Home</a>
        <a href="about.html"><i>02</i>About</a>
        <a href="cv.html"><i>03</i>CV</a>
        <a href="projects.html"><i>04</i>Projects</a>
        <a href="personal.html"><i>05</i>Personal</a>
        <a href="blog.html" class="active"><i>06</i>Log</a>
        <button class="theme-btn" type="button" aria-label="Toggle dark mode"></button>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <p style="margin:34px 0 0"><a class="back-link" href="blog.html">All log entries</a></p>
    <article class="article" id="article">
      <p class="loading">Loading…</p>
    </article>
  </main>

  <footer class="titleblock">
    <div class="tb-grid">
      <div class="tb-cell tb-title"><span class="k">Title</span><b>Engineering log — entry</b></div>
      <div class="tb-cell"><span class="k">Dwg no.</span><b>GK-26-06</b></div>
      <div class="tb-cell"><span class="k">Sheet</span><b>06 / 06</b></div>
      <div class="tb-cell"><span class="k">Drawn by</span><b>G. KIM</b></div>
      <div class="tb-cell"><span class="k">Date</span><b>JUN 2026</b></div>
      <div class="tb-cell"><span class="k">Rev</span><b>C</b></div>
    </div>
    <div class="tb-links">
      <div>&copy; <span data-year></span> Gihyun Kim — all sheets</div>
      <div class="fl">
        <a href="about.html">About</a>
        <a href="cv.html">CV</a>
        <a href="projects.html">Projects</a>
      </div>
    </div>
  </footer>

  <script src="main.js?v=52"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var file = params.get("p");
    var article = document.getElementById("article");

    if (!file || !/^[\w.\-]+\.md$/.test(file)) {
      article.innerHTML = '<p class="empty">No post specified.</p>';
    } else {
      Promise.all([
        fetch("posts.json").then(function (r) { return r.json(); }).catch(function () { return []; }),
        fetch("posts/" + file).then(function (r) { if (!r.ok) throw new Error("404"); return r.text(); })
      ])
      .then(function (results) {
        var meta = (results[0] || []).find(function (p) { return p.file === file; }) || {};
        document.title = (meta.title || "Post") + " — Gihyun Kim";
        var words = results[1].split(/\s+/).length;
        var mins = Math.max(1, Math.round(words / 220));
        var header = meta.date
          ? '<div class="post-meta">' + formatDate(meta.date) + ' &middot; ' + mins + ' min read</div>' : '';
        article.innerHTML = header + marked.parse(results[1]);
      })
      .catch(function () { article.innerHTML = '<p class="empty">Could not load this post.</p>'; });
    }

    function formatDate(s) {
      var d = new Date(s + "T00:00:00");
      if (isNaN(d)) return s;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    }
  </script>
</body>
</html>
